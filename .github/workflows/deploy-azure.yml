name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: pension-api-rg
  AZURE_CONTAINER_APP: pension-api
  REGISTRY_NAME: pensionapiregistry
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_CONTAINER_APP }}:${{ env.IMAGE_TAG }} .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_CONTAINER_APP }}:${{ env.IMAGE_TAG }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: |
            containerImage=${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_CONTAINER_APP }}:${{ env.IMAGE_TAG }}
            apiKeys=${{ secrets.API_KEYS }}
            databaseUrl=${{ secrets.DATABASE_URL }}
            corsOrigins='["https://kalkulacka-penzi-pro.pages.dev"]'
