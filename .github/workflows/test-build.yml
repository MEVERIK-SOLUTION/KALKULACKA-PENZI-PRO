name: Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check src/ tests/ api/

    - name: Type check with mypy
      run: |
        mypy src/ api/ --ignore-missing-imports || true

    - name: Security audit (pip-audit)
      run: |
        pip-audit --desc || true

    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Generate coverage report
      run: |
        python -m pytest tests/ --cov=src/backend --cov=api --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  test-cz-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx pandas

    - name: Run cz_pension_api tests
      run: |
        python -m pytest "Vývoj a rešerše s OpenCode/cz_pension_api/tests" -v --tb=short

  build-api:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build Docker image
      run: |
        docker build -t kalkulacka-penzi-pro:latest .

    - name: Test Docker image
      run: |
        docker run --rm kalkulacka-penzi-pro:latest python -c "import api.main; print('API import OK')"
