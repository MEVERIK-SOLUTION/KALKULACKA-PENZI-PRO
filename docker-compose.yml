version: '3.9'

services:
  api:
    build: .
    container_name: pension-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/venv  # Exclude venv
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - FASTAPI_LOG_LEVEL=INFO
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - pension-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend dev server (pro budoucí Vue 3)
