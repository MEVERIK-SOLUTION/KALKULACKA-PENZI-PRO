year: 2026
effective_from: "2026-01-01"
effective_to: "2026-12-31"

base_pension_amount: 4900
percent_rate_per_year: 1.495

reduction_limits:
  - threshold: 21546
    rate: 0.99
    description: "1. redukční hranice"
  - threshold: 195868
    rate: 0.26
    description: "2. redukční hranice"
  - threshold: null
    rate: 0.0
    description: "nad 2. redukční hranici"

general_assessment_base: 46278
adjustment_coefficient: 1.0581
average_wage_2025: 49262

child_allowance: 500

min_percent_amount: 4900

# Důchodový věk — strojově zpracovatelná pravidla
# Zákon 155/1995 Sb., § 32, ve znění pozdějších předpisů
retirement_age:
  male:
    # Klíč: rok_narození → věk v měsících
    born_before_1960: 720   # 60 let = 720 měsíců
    born_1960: 732           # 61 let
    born_1961: 732           # 61 let
    born_1962: 744           # 62 let
    born_1963: 744           # 62 let
    born_1964: 744           # 62 let
    born_1965: 756           # 63 let
    born_1966_and_later: 780 # 65 let
  female:
    # Základní věk = stejný jako muži (od ročníku 1971+)
    # Pro starší ročníky: snížení za vychované děti
    base: "male"  # odkaz na mužskou tabulku jako základ
    child_reduction_months:
      0: 0     # bez dětí — stejné jako muži
      1: 4     # 1 dítě — o 4 měsíce méně
      2: 8     # 2 děti — o 8 měsíců méně
      3: 12    # 3 děti — o 12 měsíců méně
      4: 16    # 4 děti — o 16 měsíců méně
      5: 20    # 5+ dětí — o 20 měsíců méně (max)
    # Poznámka: pro ženy nar. 1971+ se redukce za děti postupně ruší
    # dle přechodných ustanovení novely z roku 2023
    max_children_for_reduction: 5

substitute_periods:
  study_before_1996:
    counts: true
    without_income: true
    max_years: 6
  military:
    counts: true
    without_income: true
  childcare:
    counts: true
    without_income: true
    max_years_per_child: 4
    can_be_excluded: true
  unemployment:
    counts: true
    without_income: true
    registered_required: true

excluded_periods:
  sickness:
    description: "nemoc, karanténa (max. 180 dní v roce)"
    reduces_denominator: true
  childcare:
    description: "péče o dítě (lze vyloučit)"
    reduces_denominator: true
  military:
    description: "vojenské cvičení (max. 30 dní)"
    reduces_denominator: true

# Předčasný důchod — 2-stupňová redukce dle § 36 zákona 155/1995 Sb.
# Stupeň 1: prvních 360 dní předčasně → 0.9% za každých 90 dní
# Stupeň 2: dalších 360 dní (den 361–720) → 1.2% za každých 90 dní
# Stupeň 3: od dne 721+ → 1.5% za každých 90 dní
early_retirement:
  stages:
    - days_up_to: 360
      reduction_per_90_days: 0.9
      description: "Prvních 360 dní — 0.9% za 90 dní"
    - days_up_to: 720
      reduction_per_90_days: 1.2
      description: "Den 361–720 — 1.2% za 90 dní"
    - days_up_to: null
      reduction_per_90_days: 1.5
      description: "Od dne 721+ — 1.5% za 90 dní"
  max_years: 5
  # Legacy: jednoduchá sazba pro zpětnou kompatibilitu
  reduction_per_90_days: 1.5

validation:
  source_law: "155/1995 Sb."
  source_mpsv: "mpsv.cz/kalkulacky"
  last_updated: "2026-05-09"
  next_update: "2026-10-01"
