# KALKULAČKA PENZÍ PRO - Cloudflare Pages configuration
name = "kalkulacka-penzi-pro"

# Pages configuration
pages_build_output_dir = "frontend"

# Production prostředí
[env.production]
name = "kalkulacka-penzi-pro-prod"

# API Backend (Railway) 
[env.production.vars]
API_BASE_URL = "https://kalkulacka-penzi-pro-production.up.railway.app"

