# KALKULAČKA PENZÍ PRO - Cloudflare configuration
name = "kalkulacka-penzi-pro"
type = "javascript"

# Account ID (z .env)
account_id = "b99c06588ff17f38931b1848dea743c2"

# Workers Dev (pro testování)
workers_dev = true

# Production prostředí
[env.production]
name = "kalkulacka-penzi-pro-prod"

# Cloudflare Pages (frontend)
[[env.production.pages]]
directory = "frontend/dist"
fallback_routing = true

# API Backend (Railway) - proxy přes Cloudflare Workers
[env.production.vars]
API_BASE_URL = "https://pension-calculator-pro.railway.app"

# Pro budoucí D1 databázi
# [[d1_databases]]
# binding = "DB"
# database_name = "pension-calculator-db"
# database_id = "your-d1-database-id"

# Pro R2 storage (budoucí)
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "pension-calculator-storage"

# Build konfigurace (pro frontend)
[build]
command = "cd frontend && npm install && npm run build"
cwd = "."
watch_paths = ["frontend/**/*"]

[build.upload]
dir = "frontend/dist"
format = "service-worker"
